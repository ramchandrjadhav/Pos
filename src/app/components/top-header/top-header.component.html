<header class="top-header">
  <div class="header-left">
    <button class="hamburger-btn" (click)="onToggleSidebar()" title="Toggle Menu">
      <i class="pi pi-bars"></i>
    </button>
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#0D47A1"/>
          <path d="M12 7v10M7 12h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <h1>ONDC</h1>
        <span>Item Management</span>
      </div>
    </div>
  </div>
  <div class="header-right">
    <button class="filter-toggle-btn" (click)="onToggleFilters()" title="Toggle Filters">
      <i class="pi pi-filter"></i>
      <span>Filters</span>
    </button>
    <div class="user-info">
      <span class="user-label">Admin User</span>
      <div class="user-avatar">
        <i class="pi pi-user"></i>
      </div>
    </div>
  </div>
</header>
